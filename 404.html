<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません — T.OF...</title>
<script>
  // 名前を変えたアプリの古い URL を、新しい URL へ送る（パスの続き・?・# はそのまま）。
  // ponytail: 古い SW とキャッシュは残るが、network-first なので毎回ここを通って移る。2027-09 ごろに消す。
  const MOVED = {
    kadotsugi: 'corner-reach',
    yurazumi: 'swaystone',
    hineri: 'skewline',
    arimichi: 'langtons-ant',
    pitaori: 'shuttle-stop',
    soroekko: 'sort-visualizer',
  };
  const [, first, ...rest] = location.pathname.split('/');
  if (MOVED[first]) location.replace(`/${MOVED[first]}/${rest.join('/')}${location.search}${location.hash}`);
</script>

  html, body { margin: 0; background: #0b0c10; color: #e8e9ee; font-family: system-ui, sans-serif; }
  main { min-height: 100dvh; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
  a { color: #ffd35c; }

</main>
</body>
